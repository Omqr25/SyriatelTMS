services:
  syriatel_tms_webserver:
    build:
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
    ports:
      - "8000:80"
    depends_on:
      - syriatel_tms_app
  syriatel_tms_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      - syriatel_tms_db
    env_file:
      - ./.env
    volumes:
      - syriatel_app_attach:/var/www/html/storage/app/private

  syriatel_tms_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh ./start-worker.sh queue
    depends_on:
      - syriatel_tms_db
    env_file:
      - ./.env

  syriatel_tms_export:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 17m
    command: runuser -u www-data -- sh ./start-worker.sh applicant-exports
    depends_on:
      syriatel_tms_app:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SKIP_STORAGE_INITIALIZATION: "1"
      SKIP_STARTUP_MIGRATIONS: "1"
    volumes:
      - syriatel_app_attach:/var/www/html/storage/app/private

  syriatel_tms_sched:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: runuser -u www-data -- sh ./start-worker.sh scheduler
    depends_on:
      syriatel_tms_app:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SKIP_STORAGE_INITIALIZATION: "1"
      SKIP_STARTUP_MIGRATIONS: "1"
    volumes:
      - syriatel_app_attach:/var/www/html/storage/app/private

  syriatel_tms_db:
    image: mysql
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    volumes:
      - syriatel_app_data:/var/lib/mysql

volumes:
  syriatel_app_data:
  syriatel_app_attach:
