# The application audits authorized transfers without recording ticket credentials.
map $request_uri $log_export_request {
    ~^/api/v1/applicant-export-downloads/ 0;
    default 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;
    access_log /var/log/nginx/access.log combined if=$log_export_request;
    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass syriatel_tms_app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}