<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Token Test</title>
</head>
<body>
    <h2>Firebase Notification Token Test</h2>

    <button id="getToken">Get FCM Token</button>
    <p id="status"></p>
    <textarea id="token" rows="8" cols="70"
        placeholder="Your FCM token will appear here"></textarea>
    <br>
    <button id="copyToken">Copy Token</button>

    <script type="module">
    import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

        import {
    getMessaging,
            getToken
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";

        const firebaseConfig = {

            apiKey: "AIzaSyAbV1k43Nzcn9Kr3PSn4bnNdjuhFyEsxRc",
            authDomain: "syriateltms.firebaseapp.com",
            projectId: "syriateltms",
            storageBucket: "syriateltms.firebasestorage.app",
            messagingSenderId: "439230744675",
            appId: "1:439230744675:web:71e4ebb4b49235cda29056",
            measurementId: "G-3ZQBWDY729"
        };

        const vapidKey = "BOTsalL5ZCgo23sdjGkUAY0uNqgtQZG_Pnp8SyWteG0PYWk6JyxXzxkiTrDwZfpbujYpH5ZxFK2V-DP-rAqURhI";

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);

        document.getElementById("getToken").addEventListener("click", async () => {
    const status = document.getElementById("status");
    const tokenField = document.getElementById("token");

    try {
        status.textContent = "Requesting notification permission...";

        const permission = await Notification.requestPermission();

                if (permission !== "granted") {
                    status.textContent =
                        "Notification permission was not granted.";
                    return;
                }

                const registration = await navigator.serviceWorker.register(
            "/firebase-messaging-sw.js"
        );

                const token = await getToken(messaging, {
                    vapidKey: vapidKey,
                    serviceWorkerRegistration: registration
                });

                if (!token) {
                    status.textContent = "No token was returned.";
                    return;
                }

                tokenField.value = token;
                status.textContent = "Token generated successfully!";
                console.log("FCM Token:", token);

            } catch (error) {
        status.textContent = "Error: " + error.message;
        console.error(error);
    }
});

        document.getElementById("copyToken").addEventListener("click", async () => {
    const token = document.getElementById("token").value;

    if (!token) {
        document.getElementById("status").textContent =
            "Generate a token first.";
        return;
    }

    await navigator.clipboard.writeText(token);
            document.getElementById("status").textContent = "Token copied!";
        });
    </script>
</body>
</html>
